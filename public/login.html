<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Umucyo News - Admin Login</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,.12);
    }

    h1 {
      text-align: center;
      color: #1b5e20;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 7px;
      background: #1b5e20;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      color: #d32f2f;
    }
  </style>
</head>

<body>

<div class="login-box">
  <h1>Umucyo News</h1>
  <div class="subtitle">Admin Login</div>

  <form id="loginForm">
    <label for="password">Admin Password</label>

    <input
      type="password"
      id="password"
      placeholder="Enter admin password"
      required
    >

    <button type="submit" id="loginButton">
      Login
    </button>
  </form>

  <div id="message"></div>
</div>

<script>
window.location.href = "/admin";
</script>

</body>
</html>
